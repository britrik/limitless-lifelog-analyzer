name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build diff
        shell: bash
        run: |
          set -o pipefail
          git diff "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.css' '*.json' '*.yml' '*.yaml' ':!package-lock.json' ':!dist/**' ':!*.min.js' | head -c 40000 > pr.diff || test "${PIPESTATUS[0]}" = 0
      - name: Post AI review
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          diff = open('pr.diff', encoding='utf-8').read().strip()
          api_key = os.environ.get('GLM_API_KEY', '').strip()
          if not diff or not api_key:
              sys.exit(0)
          prompt = (
              'Review this PR for privacy, security, correctness, tests, and notable issues. '
              'Ignore whitespace, style, lock files, and generated files.\n\n'
              f"PR: {os.environ['PR_TITLE']}\n\n```diff\n{diff[:36000]}\n```\n\n"
              'Reply with ## AI Review, ### Summary, ### Findings, and ### Verdict. '
              "Verdict must be Looks good, Minor issues, author's call, or Needs changes."
          )
          payload = json.dumps({'model': 'glm-5-turbo', 'messages': [{'role': 'user', 'content': prompt}], 'max_tokens': 4096, 'temperature': 0.2}).encode()
          request = urllib.request.Request('https://api.z.ai/api/coding/paas/v4/chat/completions', data=payload, headers={'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.loads(response.read())
          except (urllib.error.URLError, urllib.error.HTTPError, json.JSONDecodeError) as error:
              print(f'GLM API error: {error}')
              sys.exit(0)
          review = (data.get('choices', [{}])[0].get('message', {}).get('content') or '').strip()
          if review:
              subprocess.run(['gh', 'pr', 'comment', os.environ['PR_NUMBER'], '--body', review], check=True)
          PYEOF