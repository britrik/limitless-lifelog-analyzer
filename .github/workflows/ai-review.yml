name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # Never block PR CI on review problems
    continue-on-error: true
    if: github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build diff
        continue-on-error: true
        run: |
          set -uo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF" --quiet || echo "WARN: could not fetch origin/$BASE_REF"
          if git rev-parse --verify -q "origin/$BASE_REF" >/dev/null; then
            git diff "origin/$BASE_REF...HEAD" -- '*.ts' '*.tsx' '*.js' '*.css' '*.json' '*.yml' '*.yaml' ':!package-lock.json' ':!dist/**' ':!*.min.js' > pr.diff
          else
            echo "WARN: origin/$BASE_REF missing; falling back to HEAD~1"
            git diff "HEAD~1...HEAD" -- '*.ts' '*.tsx' '*.js' '*.css' '*.json' '*.yml' '*.yaml' ':!package-lock.json' ':!dist/**' ':!*.min.js' > pr.diff
          fi
          echo "diff bytes: $(wc -c < pr.diff)"
      - name: Post AI review
        continue-on-error: true
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, time, urllib.error, urllib.request
          try:
              diff = open('pr.diff', encoding='utf-8').read().strip()
          except OSError:
              print('No pr.diff produced; skipping AI review.'); sys.exit(0)
          if not diff: print('No reviewable diff; skipping AI review.'); sys.exit(0)
          key = os.environ.get('GLM_API_KEY', '').strip()
          if not key: print('GLM_API_KEY not configured; skipping AI review.'); sys.exit(0)
          prompt = f"Review this PR for privacy, security, correctness, and tests.\nPR: {os.environ['PR_TITLE']}\n```diff\n{diff[:36000]}\n```"
          payload = json.dumps({'model':'glm-5-turbo','messages':[{'role':'user','content':prompt}],'max_tokens':4096,'temperature':0.2}).encode()

          data = None
          # NOTE: catch broad Exception — Python 3.12 raises builtin TimeoutError (OSError
          # subclass) on socket read timeouts, which `except URLError` does NOT catch.
          for attempt in range(3):
              req = urllib.request.Request(
                  'https://api.z.ai/api/coding/paas/v4/chat/completions',
                  data=payload,
                  headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      data = json.loads(response.read())
                  break
              except Exception as exc:  # noqa: BLE001 — resilience is the point
                  print(f'Warning: GLM attempt {attempt + 1}/3 failed: {type(exc).__name__}: {exc}')
                  time.sleep(5 * (attempt + 1))
          if data is None: print('GLM API unavailable after retries; skipping AI review.'); sys.exit(0)

          try:
              choices = data.get('choices') or []
              review = ((choices[0].get('message') or {}).get('content') or '').strip()
          except (AttributeError, IndexError, TypeError): review = ''
          if not review: print('GLM returned no review content; skipping.'); sys.exit(0)

          try:
              subprocess.run(['gh','pr','comment',os.environ['PR_NUMBER'],'--body',review], check=True, timeout=60)
          except Exception as exc:
              print(f'Warning: failed to post PR comment: {exc}')
              sys.exit(0)  # comment failure must never fail CI
          PY
