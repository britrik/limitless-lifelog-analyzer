name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.css' '*.json' '*.yml' '*.yaml' ':!package-lock.json' ':!dist/**' ':!*.min.js' | head -c 40000 > pr.diff
      - name: Post AI review
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, subprocess, sys
          diff = open('pr.diff').read().strip()
          if not diff or not os.environ.get('GLM_API_KEY','').strip(): sys.exit(0)
          payload = json.dumps({'model':'glm-5-turbo','messages':[{'role':'user','content':f'Review this PR for privacy, security, correctness, and tests. PR: {os.environ["PR_TITLE"]}\n\n```diff\n{diff}\n```'}],'max_tokens':4096,'temperature':0.2}).encode()
          req = urllib.request.Request('https://api.z.ai/api/coding/paas/v4/chat/completions', data=payload, headers={'Authorization':f'Bearer {os.environ["GLM_API_KEY"]}','Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r: data=json.loads(r.read())
          review=(data['choices'][0]['message'].get('content') or '').strip()
          if review: subprocess.run(['gh','pr','comment',os.environ['PR_NUMBER'],'--body',review],check=True)
          PYEOF
